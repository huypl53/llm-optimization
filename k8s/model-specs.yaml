# Model specifications for vLLM serving
# This file defines the models and their configurations

models:
  - name: "qwen3_4B_quan"
    description: "Qwen3-VL-4B-Instruct with AWQ INT4 quantization"
    repository: "vllm/vllm-openai"
    tag: "latest"
    modelURL: "huypl53/Qwen3-VL-4B-Instruct-AWQ-INT4"

    # Resource configuration
    replicaCount: 3
    requestCPU: 6
    requestMemory: "8Gi"
    requestGPU: 1
    limitCPU: 8
    limitMemory: "16Gi"

    # vLLM configuration
    vllmConfig:
      maxModelLen: 16384
      gpuMemoryUtilization: 0.25
      extraArgs:
        - "--disable-log-requests"

# Default model for testing
defaultModel: "huypl53/Qwen3-VL-4B-Instruct-AWQ-INT4"
