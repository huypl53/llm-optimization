[project]
name = "optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "llmcompressor>=0.9.0",
  "pyyaml>=6.0",
  "transformers>=4.57.3",
  "torch>=2.9.1",  
  "torchvision==0.24.1", 
  "torchaudio==2.9.1",
  "einops>=0.8.1",
  "timm>=1.0.24",
]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true



[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
